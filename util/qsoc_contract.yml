# =============================================================================
# QSOC inter-block contract -- THE single source of truth.
#
# Every number here is shared by more than one block, which is exactly why it
# lives in one file instead of being retyped in each wrapper. The defects this
# project has already paid for were all of this kind:
#
#   ROM 8 KiB against 2 KiB · APB_M11 against APB_S11 · eleven interrupt
#   sources against twelve · apb_adv_timer against apb_timer_unit
#
# Each is two documents disagreeing about one fact. Generating instead of
# retyping makes that impossible rather than merely detectable.
#
# GENERATED FROM THIS FILE -- do not hand-edit the outputs:
#   design/top/rtl/qnsc_pkg.sv     the package every wrapper imports
#
# CI regenerates and compares. A diff fails the build, so the committed package
# can never drift from this file.
#
# TO CHANGE A NUMBER: edit here, run `python3 util/gen_qnsc_pkg.py`, commit both.
#
# Fields marked `tbd: true` are not yet agreed. They are named rather than
# omitted, so the gap is visible instead of being silently filled in by whoever
# needs it first.
# =============================================================================

meta:
  project: QSOC
  data_width: 32
  addr_width: 32
  clock_mhz: 20

# -----------------------------------------------------------------------------
# Memory map. Source: QSOC_HAS Table 7-1, cross-checked against QNSC_RAM_MAS
# section 5.1 and QNSC_SYSDBG_MAS Table 11.
#
# Every address in the 32-bit space belongs to exactly one row; an access
# outside them returns a decode error rather than reaching a subordinate.
# -----------------------------------------------------------------------------
memory_map:
  - name: rom
    base: 0x00000000
    size: 0x00000800          # 2 KiB
    port: AXI_M0
    kind: memory
    note: >
      Boot code, read-only, executable. 2 KiB after the Day005 review of
      2026-09-18; the first 128 B are the trap vector table forced by the Ibex
      reset vector, leaving 1920 B, which is why the bootloader must use the
      bitwise CRC32 rather than the table-driven one.

  - name: isram_dbg
    base: 0x20000000
    size: 0x00001000          # 4 KiB
    port: AXI_M1
    kind: memory
    note: >
      The debug window: the first 4 KiB of ISRAM, not a block of its own.
      Firmware must place nothing here. Enforced by a PMP region.

  - name: isram
    base: 0x20001000
    size: 0x0000F000          # 60 KiB
    port: AXI_M1
    kind: memory
    note: The downloaded application. Firmware links the main image at this base.

  - name: dsram
    base: 0x30000000
    size: 0x00008000          # 32 KiB
    port: AXI_M2
    kind: memory
    note: >
      Stack, heap and variables. Separate from ISRAM so a stack overflow cannot
      overwrite the running program -- the only protection available without an MPU.

  - name: sysctl
    base: 0x80000000
    size: 0x00004000
    port: APB_M0
    kind: peripheral
  - name: syscsr
    base: 0x80004000
    size: 0x00004000
    port: APB_M1
    kind: peripheral
  - name: wdt
    base: 0x80008000
    size: 0x00004000
    port: APB_M2
    kind: peripheral
  - name: gpio_0
    base: 0x8000C000
    size: 0x00004000
    port: APB_M3
    kind: peripheral
  - name: gpio_1
    base: 0x80010000
    size: 0x00004000
    port: APB_M4
    kind: peripheral
  - name: gpio_2
    base: 0x80014000
    size: 0x00004000
    port: APB_M5
    kind: peripheral
  - name: gpio_3
    base: 0x80018000
    size: 0x00004000
    port: APB_M6
    kind: peripheral
  - name: timer_0
    base: 0x8001C000
    size: 0x00004000
    port: APB_M7
    kind: peripheral
    note: apb_timer_unit in 64-bit mode; QSOC's timebase.
  - name: timer_1
    base: 0x80020000
    size: 0x00004000
    port: APB_M8
    kind: peripheral
    note: apb_timer_unit as two independent 32-bit timers.
  - name: uart_0
    base: 0x80024000
    size: 0x00004000
    port: APB_M9
    kind: peripheral
    note: Carries the boot download.
  - name: uart_1
    base: 0x80028000
    size: 0x00004000
    port: APB_M10
    kind: peripheral
  - name: spi
    base: 0x8002C000
    size: 0x00004000
    port: APB_M11
    kind: peripheral
    note: >
      One APB4 slave for both SPI blocks: host at wrapper offset 0x0000-0x0FFF,
      reserved 0x1000-0x1FFF, device at 0x2000-0x3FFF.
  - name: i2c
    base: 0x80030000
    size: 0x00004000
    port: APB_M12
    kind: peripheral
  - name: pwm
    base: 0x80034000
    size: 0x00004000
    port: APB_M13
    kind: peripheral
    note: A separate apb_adv_timer instance, not a pad function of the timers.
  - name: dma_cfg
    base: 0x80038000
    size: 0x00004000
    port: APB_M14
    kind: peripheral
    note: Register interface of the DMA. Its data path is an AXI master on AXI_S2.

  - name: sysdbg
    base: 0xF0000000
    size: 0x0000000C          # 12 B -- CTRL, STATUS, ID
    port: none
    kind: jtag_only
    note: >
      Decoded inside the debug block and never placed on S_BUS, so software
      running on the core cannot halt it or grant itself debug access. The
      crossbar must leave this region unmapped and answer DECERR -- a slave here
      would shadow the registers.

# -----------------------------------------------------------------------------
# Interrupts. Source: QSOC_HAS Table 8-1, QNSC_Interrupt_Map_MAS section 5.3.
#
# INTMAP is an OR tree: one OR per peripheral, no state, no address, no bus port.
# The line index IS the priority -- Ibex resolves the lowest index first -- so
# this list fixes the default priority order as well as the wiring, and changing
# it means re-synthesising.
#
# Order follows the rule "data loss first, human time last": a missed SPI or
# UART event loses a byte that cannot be recovered, while a missed timer tick
# arrives again next period.
# -----------------------------------------------------------------------------
interrupts:
  fast_lines_available: 15       # Ibex irq_fast_i width, unconditional
  lines:
    - line: 0
      peripheral: dma
      sources: 1
      shape: level
      note: Held by DMA_ISR write-1-to-clear flags -- QNSC_iDMA V2.0.
    - line: 1
      peripheral: spi_device
      sources: 8
      shape: level
    - line: 2
      peripheral: spi_host
      sources: 2
      shape: level
    - line: 3
      peripheral: i2c
      sources: 1
      shape: level
    - line: 4
      peripheral: uart_0
      sources: 1
      shape: level
    - line: 5
      peripheral: uart_1
      sources: 1
      shape: level
    - line: 6
      peripheral: timer_1
      sources: 2
      shape: pulse
    - line: 7
      peripheral: pwm
      sources: 4
      shape: pulse
      note: Four event lines, each a 4-of-16 multiplexer over the channel outputs.
    - line: 8
      peripheral: wdt_wakeup
      sources: 1
      shape: level
    - line: 9
      peripheral: gpio
      sources: 4
      shape: pulse
      note: Four instances OR to one line; per-pin identity is in each INTSTATUS.
    - line: 10
      peripheral: timer_0
      sources: 1
      shape: pulse
  nmi:
    peripheral: wdt_bark
    mcause: 31
    sources: 1
    shape: level
    note: >
      Feed-through to irq_nm_i, never through INTMAP, because an NMI cannot be
      masked -- if firmware hangs with interrupts disabled the bark still lands.
  tied_low:
    - irq_external_i
    - irq_timer_i
    - irq_software_i
  note: >
    mcause is 16 + line, and the vector is mtvec + 4 * mcause. The privileged
    specification allocates causes 16 and above to platform use, so the core
    identifies the source by itself and no claim register is read.

# -----------------------------------------------------------------------------
# Clock and reset domains. Source: QSOC_HAS Table 4-2, confirmed in
# QNSC_RAM_MAS 5.2, QNSC_SYSDBG_MAS 4.2 and QNSC_PWM_MAS.
#
# One clock frequency for the whole chip, so nothing here crosses a frequency
# boundary; a domain is a gate plus a soft-reset bit, not a separate clock.
# -----------------------------------------------------------------------------
clock_domains:
  - name: D12
    blocks: [rom]
    soft_reset_bit: 11
    note: ROM is its own domain, separate from the RAMs.
  - name: D13
    blocks: [isram, dsram]
    soft_reset_bit: 12
    note: >
      Both RAMs share one bit. A soft reset of D13 resets the memory holding the
      code that issued the write, so firmware running from ISRAM cannot reset
      this domain and survive -- safe only from ROM. SOFT_RST_CTRL bits [15:14]
      are reserved as the escape hatch if the two ever need splitting.
  - name: D15
    blocks: [sysdbg]
    soft_reset_bit: 14
    gate_open_after_reset: true
    gate_closable_by_software: false
    note: >
      Must be open out of reset and not closable by software. The TAP runs on
      tck_i, so gating clk_i would leave the host able to shift commands in with
      nothing executing them -- a silent way to disable the debugger.
  - name: D18
    blocks: [pwm]
    soft_reset_bit: 15
    note: >
      Closing this gate freezes the channel outputs at their current level --
      out_filter only updates while ctrl_active_i is high. For a power stage a
      held level is not a neutral state, so a running block is never gated.

# -----------------------------------------------------------------------------
# Reset sources. Source: Day005 review of 2026-09-18.
# Debug reset was removed explicitly, which is why SYSDBG has no ndmreset.
# -----------------------------------------------------------------------------
reset_sources: [power_on, watchdog, software]

# -----------------------------------------------------------------------------
# Not yet agreed. Named so the gap is visible.
# -----------------------------------------------------------------------------
tbd:
  - item: clock domains for the remaining peripherals
    owner: SCRC owner
    note: >
      D12, D13, D15 and D18 are fixed. The domain and soft-reset bit for UART,
      SPI, I2C, GPIO, WDT, DMA, TIMER and the buses are not recorded in any
      specification this file was built from.
  - item: APB/AXI port signal names
    owner: bus owner
    note: >
      QNSC_RTL_Design_Naming_Rule V1.0 fixes the form -- i_bus_apb_<signal> and
      i_bus_axi_<channel>_<signal> -- but the per-port width list belongs to the
      bus specification and is not duplicated here yet.
