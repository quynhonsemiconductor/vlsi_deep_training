# =============================================================================
# Upstream IP manifest — QSOC
#
# Every third-party block is VENDORED into vendor/, not submoduled. Three reasons,
# all specific to this project rather than general preference:
#
#   1. The IP comes from four upstreams and eight separate pulp-platform repos.
#      Eleven submodules to assemble one chip is a git exercise, not an RTL one.
#   2. OpenTitan is gigabyte-scale and QSOC needs three blocks from it.
#   3. Tape-out needs a frozen, auditable source. Every upstream fact the
#      specifications rely on is commit-specific -- riscv-dbg's IdcodeValue,
#      aon_timer's five interrupt outputs, apb_timer_unit's MODE_64 bit position,
#      apb_adv_timer's 4-of-16 event multiplexer. Without a recorded commit none of
#      those claims can be re-checked.
#
# RULES, enforced by flow/lint/vendor_guard.sh in RTL · CI:
#   - Do not edit files under vendor/. Local fixes go in vendor/patches/ with a
#     reason, so the next upstream bump does not silently revert them.
#   - Any change under vendor/ must update this file in the same PR.
#
# `commit:` is left as TODO where the tree has not been vendored yet. Fill it at
# the moment of vendoring -- a manifest with a placeholder is worse than no
# manifest, because it looks authoritative.
# =============================================================================

upstreams:
  # ---------------------------------------------------------------------------
  - name: lowRISC/ibex
    url: https://github.com/lowRISC/ibex
    commit: TODO
    license: Apache-2.0
    used_by: [design/cpu]
    notes: >
      RV32IMC core. Facts the specifications depend on and that must be re-checked
      against whatever commit is pinned: fetch_addr_n = {boot_addr_i[31:8], 8'h80}
      in ibex_if_stage.sv, so the reset vector is boot_addr + 0x80 and the low byte
      of boot_addr_i is declared unused with an assertion that it is zero; mip is
      purely combinational (assign mip.irq_fast = irq_fast_i), so the core latches
      no pending bit; irq_fast_i is 15 bits unconditional; mtvec bit 0 is forced to
      1 for plain RV32IMC, so vectored mode is not configurable; fast-line priority
      resolves lowest index first; dscratch0 and dscratch1 exist as real flops.

  # ---------------------------------------------------------------------------
  - name: lowRISC/opentitan
    url: https://github.com/lowRISC/opentitan
    commit: aecc39ba9a49e277662fd528a6b3018a05b7d06f
    license: Apache-2.0
    used_by: [design/spi, design/wdt]
    partial: true
    files:
      - hw/ip/spi_host/rtl/**
      - hw/ip/spi_device/rtl/**
      - hw/ip/aon_timer/rtl/**
      - hw/ip/tlul/rtl/tlul_adapter_host.sv
      - hw/ip/prim/rtl/**
    notes: >
      Commit taken from the SPI owner's specification, reviewed 2026-09-17; the WDT
      must be vendored at the same commit so the prim_* and tlul dependencies are
      one consistent set. All three blocks are TL-UL and need an APB-to-TL-UL
      wrapper: SPI has one specified (one APB4 slave, two adapters), aon_timer does
      not yet. aon_timer has five outputs, of which QSOC connects two:
      intr_wkup_timer_expired_o and nmi_wdog_timer_bark_o. Its watchdog enable is
      in WDOG_CTRL offset 0x1C, so without a bus path the block cannot bark.
      alert_*, racl_* and lc_escalate_en_i have no QSOC counterpart and must be
      tied off in the wrapper.

  # ---------------------------------------------------------------------------
  - name: pulp-platform/timer_unit
    url: https://github.com/pulp-platform/timer_unit
    commit: TODO
    license: SHL-0.51
    used_by: [design/timer]
    files: [rtl/apb_timer_unit.sv, rtl/timer_unit_counter.sv, rtl/timer_unit_counter_presc.sv]
    notes: >
      The repository is named timer_unit; the module QSOC instantiates is
      apb_timer_unit. Searching for a repo named after the module returns nothing.
      Two instances: TIMER0 with MODE_64 = 1, TIMER1 with MODE_64 = 0. The
      comparator is registered and NOT gated by the counter enable, which is why
      one-shot mode yields a held level rather than a pulse. Compare is on equality,
      not greater-or-equal.

  - name: pulp-platform/apb_adv_timer
    url: https://github.com/pulp-platform/apb_adv_timer
    commit: TODO
    license: SHL-0.51
    used_by: [design/pwm]
    notes: >
      One instance, the PWM block. TIMER_NBITS = 16, EXTSIG_NUM = 32. The four
      events_o are a 4-of-16 multiplexer over the channel outputs, edge-detected to
      one cycle, and inert until EVENT_CFG is programmed. The per-timer status_o is
      connected to nothing readable. out_filter only updates while ctrl_active_i is
      high, so a stopped channel holds its last level.

  - name: pulp-platform/axi
    url: https://github.com/pulp-platform/axi
    commit: TODO
    license: SHL-0.51
    used_by: [design/bus, design/sysdbg]
    files:
      - src/axi_xbar.sv
      - src/axi_to_axi_lite.sv
      - src/axi_lite_to_apb.sv
      - src/axi_from_mem.sv
      - src/axi_lite_from_mem.sv
      - src/axi_lite_to_axi.sv
    notes: >
      axi_xbar is fully connected -- every slave port reaches every master port
      through one shared address map -- which is what lets SYSDBG's master read ROM.
      Each slave port has a private decode-error slave returning 32'hBADCAB1E.
      axi_from_mem is axi_lite_from_mem + axi_lite_to_axi, used by SYSDBG with
      MaxRequests = 1.

  - name: pulp-platform/riscv-dbg
    url: https://github.com/pulp-platform/riscv-dbg
    commit: TODO
    license: SHL-0.51
    used_by: []
    reference_only: true
    notes: >
      READ AS REFERENCE, NOT INSTANTIATED. SYSDBG is designed in house; this tree is
      vendored so the claims made against it stay checkable. Its dm_sba.sv uses the
      same memory-style port SYSDBG's master exposes, and the repo ships an OBI
      wrapper and no AXI wrapper. Its IdcodeValue default is 32'h00000DB3, which
      QSOC deliberately does NOT reuse -- QSOC's IDCODE is 0x0515_3001.

  - name: pulp-platform/idma
    url: https://github.com/pulp-platform/idma
    commit: TODO
    license: SHL-0.51
    used_by: [design/dma]
    notes: >
      Backend only. The frontend is in house per QNSC_iDMA V2.0: neither desc64 nor
      reg is used, because desc64's CSRs are hardwired to a 64-bit APB and QSOC's is
      32-bit. One dma_irq_o, held by write-1-to-clear flags in DMA_ISR.

  - name: pulp-platform/apb_uart
    url: https://github.com/pulp-platform/apb_uart
    commit: TODO
    license: SHL-0.51
    used_by: [design/uart]

  - name: pulp-platform/apb_gpio
    url: https://github.com/pulp-platform/apb_gpio
    commit: TODO
    license: SHL-0.51
    used_by: [design/gpio]
    notes: >
      Four instances, one `interrupt` output each, OR'd to one fast line by INTMAP.
      Per-pin INTSTATUS at offset 0x24 is READ-TO-CLEAR and set beats clear, so a
      handler gets exactly one look and must service every bit it reads.

  - name: pulp-platform/apb_i2c
    url: https://github.com/pulp-platform/apb_i2c
    commit: TODO
    license: SHL-0.51
    used_by: [design/i2c]

  # ---------------------------------------------------------------------------
  - name: nguyenquanicd/AXI4-SRAM-CONTROLLER
    url: https://github.com/nguyenquanicd/AXI4-SRAM-CONTROLLER
    commit: TODO
    license: UNRESOLVED
    used_by: [design/ram]
    notes: >
      LICENCE IS AN OPEN ACTION, not an oversight in this file: the repository
      carries no LICENSE file, so the terms are undefined rather than permissive.
      It is the mentor's own repository, so this is one question to ask rather than
      an author to trace. Also used by ROM. Known finding to report upstream: WRAP
      is declared and not implemented. The controller has no WSTRB path, which QSOC
      adds in the RAM wrapper.

  - name: nguyenquanicd/APB-BUS-Generator
    url: https://github.com/nguyenquanicd/APB-BUS-Generator
    commit: TODO
    license: UNRESOLVED
    used_by: [design/bus]
    generator: true
    notes: >
      Produces m_vlsi_apb_router from a spreadsheet. Genuinely multi-master with
      per-slave round-robin arbitration, which is what lets MRV-CPU and AXI2APB
      share P_BUS. Generated RTL is committed alongside its spreadsheet input in
      util/gen -- committing only one of the two loses either reproducibility or the
      source of truth.

  - name: nguyenquanicd/APB-CSR-Generator
    url: https://github.com/nguyenquanicd/APB-CSR-Generator
    commit: TODO
    license: UNRESOLVED
    used_by: [design/scrc]
    generator: true

  - name: nguyenquanicd/MRV-CPU
    url: https://github.com/nguyenquanicd/MRV-CPU
    commit: TODO
    license: UNRESOLVED
    used_by: [design/scrc]
    notes: >
      Mini RV32I core, single-cycle, 13-instruction subset, used inside SCRC to
      sequence clock enables and reset release instead of a hand-written FSM. It has
      its own instruction memory port, so its RESET_VECTOR of 0x0000_1000 is in its
      private space and not in the QSOC memory map. It is an APB master and has an
      i_interrupt input driven by the APB write strobe on SOFT_RST_CTRL.
