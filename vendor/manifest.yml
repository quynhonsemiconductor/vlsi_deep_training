# =============================================================================
# Upstream IP manifest — QSOC
#
# Every third-party block is VENDORED into vendor/, not submoduled. Three reasons,
# all specific to this project rather than general preference:
#
#   1. The IP comes from four upstreams and eight separate pulp-platform repos.
#      Eleven submodules to assemble one chip is a git exercise, not an RTL one.
#   2. OpenTitan is gigabyte-scale and QSOC needs three blocks from it.
#   3. Tape-out needs a frozen, auditable source. Every upstream fact the
#      specifications rely on is commit-specific -- riscv-dbg's IdcodeValue,
#      aon_timer's five interrupt outputs, apb_timer_unit's MODE_64 bit position,
#      apb_adv_timer's 4-of-16 event multiplexer. Without a recorded commit none of
#      those claims can be re-checked.
#
# RULES, enforced by flow/lint/vendor_guard.sh in RTL · CI:
#   - Do not edit files under vendor/. Local fixes go in vendor/patches/ with a
#     reason, so the next upstream bump does not silently revert them.
#     A patch may also add a feature that needs the IP's internal state; anything
#     that can be built from the IP's ports belongs in the wrapper instead.
#   - A dependency of a vendored IP is vendored as its own entry, at the version
#     the parent pins, with files: limited to what is compiled.
#   - See CONTRIBUTING.md, "What vendor/ is", for the cases in full.
#   - Any change under vendor/ must update this file in the same PR.
#
# `commit:` is left as TODO where the tree has not been vendored yet. Fill it at
# the moment of vendoring -- a manifest with a placeholder is worse than no
# manifest, because it looks authoritative. util/vendor_ip.py records the SHA
# here and in vendor/vendor.lock.yml automatically.
#
# LICENCE VALUES:
#   Apache-2.0, SHL-0.51        -- SPDX / upstream licence, as published.
#   MentorProvided-QNSC-Course  -- the nguyenquanicd/* repos carry no LICENSE
#                                  file, but they are the course mentor's own
#                                  code, provided for use in this training. This
#                                  token records that understanding explicitly
#                                  rather than leaving the field undefined.
# =============================================================================

upstreams:
- name: lowRISC/ibex
  url: https://github.com/lowRISC/ibex
  commit: e9f55342edbd27e9e17a0e41b1c95a81abb5eac8
  license: Apache-2.0
  used_by:
  - design/cpu
  notes: 'RV32IMC core. Facts the specifications depend on and that must be re-checked against whatever
    commit is pinned: fetch_addr_n = {boot_addr_i[31:8], 8''h80} in ibex_if_stage.sv, so the reset vector
    is boot_addr + 0x80 and the low byte of boot_addr_i is declared unused with an assertion that it is
    zero; mip is purely combinational (assign mip.irq_fast = irq_fast_i), so the core latches no pending
    bit; irq_fast_i is 15 bits unconditional; mtvec bit 0 is forced to 1 for plain RV32IMC, so vectored
    mode is not configurable; fast-line priority resolves lowest index first; dscratch0 and dscratch1
    exist as real flops.

    '
  files:
  - rtl/**
  - LICENSE
  - NOTICE
