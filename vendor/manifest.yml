  - '*.py'
  - '*.xlsx'
  - README.md
- name: nguyenquanicd/APB-DEC-Generator
  url: https://github.com/nguyenquanicd/APB-DEC-Generator
  commit: 90bd54d8860eff2fe65a17b93b425a6ca79600d7
  license: MentorProvided-QNSC-Course
  used_by:
  - design/bus
  generator: true
  notes: 'Produces a single-master, N-slave APB4 address decoder (m_qnsc_p_bus_dec here, named by the
    workbook) from a spreadsheet -- no arbitration, unlike APB-BUS-Generator above. P_BUS''s AXI2APB
    bridge is the block''s only APB master today, so decode-only is enough; see
    doc/specs/QNSC_BUS_DECISIONS.md, "P_BUS router: decoder only, not APB-BUS-Generator". Has no PPROT
    port at all (master or slave side): m_qnsc_wrap_bus''s own pprot field is dropped at the connection,
    an accepted limitation, not a bug, since no peripheral MAS specifies PPROT-dependent behaviour.
    Generated RTL is committed alongside its spreadsheet input in util/gen, same convention as
    APB-BUS-Generator above.

    '
  files:
