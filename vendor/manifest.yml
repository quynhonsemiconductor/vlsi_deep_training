- name: pulp-platform/timer_unit
  url: https://github.com/pulp-platform/timer_unit
  commit: 4c69615c89db9397a9747d6f6d6a36727854f0bc
  license: SHL-0.51
  used_by:
  - design/timer
  files:
  - rtl/apb_timer_unit.sv
  - rtl/timer_unit_counter.sv
  - rtl/timer_unit_counter_presc.sv
  notes: 'The repository is named timer_unit; the module QSOC instantiates is apb_timer_unit. Searching
    for a repo named after the module returns nothing. Two instances: TIMER0 with MODE_64 = 1, TIMER1
    with MODE_64 = 0. The comparator is registered and NOT gated by the counter enable, so one-shot mode
    yields a held level with a prescaler or ref clock, and a one-cycle pulse without (QNSC_TIMER_MAS 7.3). Compare is on equality, not greater-or-equal.

    '
- name: pulp-platform/apb_adv_timer
  url: https://github.com/pulp-platform/apb_adv_timer
  commit: c8faec1e1755386d0e0f31a55ebd80612a3dcea9
  license: SHL-0.51
  used_by:
  - design/pwm
  notes: 'One instance, the PWM block. TIMER_NBITS = 16, EXTSIG_NUM = 32. The four events_o are a 4-of-16
    multiplexer over the channel outputs, edge-detected to one cycle, and inert until EVENT_CFG is programmed.
    The per-timer status_o is connected to nothing readable. out_filter only updates while ctrl_active_i
