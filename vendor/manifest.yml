- name: nguyenquanicd/APB-BUS-Generator
  url: https://github.com/nguyenquanicd/APB-BUS-Generator
  commit: 5661aecf96f8349987e600fe4e8a124c35e3d836
  license: MentorProvided-QNSC-Course
  used_by:
  - design/scrc
  generator: true
  notes: 'Produces m_vlsi_apb_router from a spreadsheet. Genuinely multi-master with per-slave round-robin
    arbitration -- used for the private 2-master bus inside SCRC (MRV-CPU and the APB_M0 port, one slave:
    SCRC CSR; QNSC_SCRC_MAS 3). No longer used for P_BUS (see nguyenquanicd/APB-DEC-Generator below):
    P_BUS has exactly one master today, so the arbitration this tool exists for is dead weight there, and
    keeping both instances on this one tool would have meant two m_vlsi_apb_router modules (its own
    top/leaf names are hard-coded) colliding under Naming Rule 2.1 -- open item in QNSC_SCRC_MAS 11.
    Generated RTL is committed alongside its spreadsheet input in util/gen -- committing only one of the
    two loses either reproducibility or the source of truth.

    '
