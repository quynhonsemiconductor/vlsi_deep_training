  - README.md
- name: nguyenquanicd/MRV-CPU
  url: https://github.com/nguyenquanicd/MRV-CPU
  commit: eea0028c969015e8fac911278e51e7beca27175e
  license: MentorProvided-QNSC-Course
  used_by:
  - design/scrc
  notes: 'Mini RV32I core, single-cycle, 13-instruction subset, used inside SCRC to sequence clock enables
    and reset release instead of a hand-written FSM. It has its own instruction memory port, so its RESET_VECTOR
    of 0x0000_1000 is in its private space and not in the QSOC memory map. It is an APB master with no
    PSTRB, PPROT or PSLVERR port. i_interrupt is tied 0: SCRC polls CLK_EN and SOFT_RST_CTRL instead,
    because the interrupt is an unmasked edge that can be lost during a BIU stall (QNSC_SCRC_DECISIONS 2).

    '
  files:
  - rtl/**
  - docs/MRV-CPU-SPEC.md
  - README.md
  - utils/**
