  - '*.xlsx'
  - Makefile
  - source_me.sh
- name: nguyenquanicd/APB-CSR-Generator
  url: https://github.com/nguyenquanicd/APB-CSR-Generator
  commit: ee80ff5415edc409743f58b99f28881c04a44ee1
  license: MentorProvided-QNSC-Course
  used_by:
  - design/scrc
  generator: true
  notes: 'Generates SCRC CSR and SYSCSR. Module name set by the workbook. Output kept in util/gen with
    its workbook: the generated port names (i_bus_rstn, i_paddr) fail the Naming Rule, so each block wraps
    it (m_qnsc_syscsr). A w1c field gives an APB write priority over the hardware set in the same cycle.

    '
