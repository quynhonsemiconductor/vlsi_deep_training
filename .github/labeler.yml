# PR auto-labeler config — maps file path patterns to labels.
# Used by the labeler workflow (labeler.yml).
# Labels must exist in the repo before they can be applied: see
# .github/labels.yml and the bootstrap commands in .github/POLICY.md.

# ---- blocks ----------------------------------------------------------------
area/ram:
  - changed-files:
    - any-glob-to-any-file: ["design/ram/**", "dv/ram/**"]

area/sysdbg:
  - changed-files:
    - any-glob-to-any-file: ["design/sysdbg/**", "dv/sysdbg/**"]

area/intmap:
  - changed-files:
    - any-glob-to-any-file: ["design/intmap/**", "dv/intmap/**"]

area/timer:
  - changed-files:
    - any-glob-to-any-file: ["design/timer/**", "dv/timer/**"]

area/pwm:
  - changed-files:
    - any-glob-to-any-file: ["design/pwm/**", "dv/pwm/**"]

area/scrc:
  - changed-files:
    - any-glob-to-any-file: ["design/scrc/**", "dv/scrc/**"]

area/dma:
  - changed-files:
    - any-glob-to-any-file: ["design/dma/**", "dv/dma/**"]

area/bus:
  - changed-files:
    - any-glob-to-any-file: ["design/bus/**", "dv/bus/**"]

area/spi:
  - changed-files:
    - any-glob-to-any-file: ["design/spi/**", "dv/spi/**"]

area/iomux:
  - changed-files:
    - any-glob-to-any-file: ["design/iomux/**", "dv/iomux/**"]

# ---- shared surfaces -------------------------------------------------------
# These three get their own labels because a change to any of them can move
# another block's contract without touching that block's directory.
area/rom:
  - changed-files:
    - any-glob-to-any-file: ["design/rom/**", "dv/rom/**"]

area/cpu:
  - changed-files:
    - any-glob-to-any-file: ["design/cpu/**", "dv/cpu/**"]

area/uart:
  - changed-files:
    - any-glob-to-any-file: ["design/uart/**", "dv/uart/**"]

area/i2c:
  - changed-files:
    - any-glob-to-any-file: ["design/i2c/**", "dv/i2c/**"]

area/gpio:
  - changed-files:
    - any-glob-to-any-file: ["design/gpio/**", "dv/gpio/**"]

area/wdt:
  - changed-files:
    - any-glob-to-any-file: ["design/wdt/**", "dv/wdt/**"]

area/common:
  - changed-files:
    - any-glob-to-any-file: ["design/common/**"]

area/top:
  - changed-files:
    - any-glob-to-any-file: ["design/top/**", "dv/top/**"]

area/vendor:
  - changed-files:
    - any-glob-to-any-file: ["vendor/**"]

area/gen:
  - changed-files:
    - any-glob-to-any-file: ["util/**"]

# ---- flow and documents ----------------------------------------------------
area/pd:
  - changed-files:
    - any-glob-to-any-file: ["pd/**", "flow/syn/**"]

area/fpga:
  - changed-files:
    - any-glob-to-any-file: ["fpga/**"]

area/doc:
  - changed-files:
    - any-glob-to-any-file: ["doc/**"]

area/ci:
  - changed-files:
    - any-glob-to-any-file: [".github/**", "Makefile", "flow/**"]

# ---- cross-cutting flag ----------------------------------------------------
# Raised when a PR touches the contract surfaces at the same time as a block.
# Not a substitute for review, just a prompt to check the other side moved too.
contract-change:
  - changed-files:
    - any-glob-to-any-file: ["util/qsoc_contract.yml", "design/top/rtl/qnsc_pkg.sv", "vendor/manifest.yml"]
