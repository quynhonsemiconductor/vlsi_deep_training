# =============================================================================
# PR Labeler — thin caller of the org's shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
#
# Uses `pull_request`, NOT `pull_request_target`. pull_request_target runs with a
# write-scoped token in the context of the base repo even for fork PRs, which is
# the dangerous-triggers finding zizmor flags. This is an internal org repo, so
# pull_request grants pull-requests: write for same-repo PRs and is safe.
# Mirrors rova's working caller.
# =============================================================================
name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@v1
    permissions:
      contents: read
      pull-requests: write
