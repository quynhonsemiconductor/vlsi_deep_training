# =============================================================================
# RTL · CI — lint and structural checks for a hardware repository.
#
# This is the workflow that does not come from rova, because rova is a software
# repo. What a chip repo needs on every PR is different:
#
#   1. Verilator lint on each block that has RTL. Catches width mismatches,
#      undriven and multiply-driven signals, and unused declarations -- the class
#      of defect that simulates fine and fails in synthesis.
#   2. A guard that nobody edited vendor/. Upstream IP is vendored, not
#      submoduled, so the tree is writable and an accidental edit would be
#      invisible at the next upstream bump.
#   4. A guard that vendor/manifest.yml moved whenever vendor/ did. Every upstream
#      fact this project relies on is commit-specific: riscv-dbg's IdcodeValue,
#      aon_timer's port list, apb_timer_unit's MODE_64 bit.
#
# Every step calls a target of the root Makefile, so `make check` runs the same
# commands locally.
#
# TOOLCHAIN: every job runs in the digest-pinned qnsc-eda container, the same
# image the Coder workspace uses. That replaces the runner's apt Verilator, the
# docker.io Verilator image used by Connectivity/Simulation, and the per-job
# emacs/PyYAML installs. VCS sign-off (make vc-lint / vc-cdc / vc-rdc / syn-dc /
# sta-pt, #50) still needs the licences on the training server and does not run
# in this workflow.
#
# Jobs are deliberately independent and none is guarded by an `if` on the event
# action -- see the comment in pr-title.yml for why that guard produces a false
# green.
# =============================================================================
name: RTL · CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: rtl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Verilator lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Verilator comes from the qnsc-eda container image (5.054).
      #
      # One invocation per block, driven by design/<block>/<block>.f rather than
      # by `find` -- see the header of lint_all.sh for why that matters here.
      # Blocks whose filelist has no sources yet are skipped rather than failing.
      - name: Lint each block
        run: make lint

  # ---------------------------------------------------------------------------
  filelists:
    name: Filelist paths
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every path in a design/**/*.f is relative to the filelist and exists. An
      # absolute path (/home/<user>/...) works only in the checkout it was
      # written in; a missing file fails only when someone else builds.
      - name: Check every filelist path
        run: make filelists

  # ---------------------------------------------------------------------------
  wrappers:
    name: Generated wrappers
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    # The azure mirror has twice crawled past 10 minutes just downloading emacs
    # (#69 and #26 reruns, 2026-10-23: 54 MB over ~10 min, canceled at Get:5).
    # The download does complete; the job simply needs the headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # emacs-nox comes from the qnsc-eda container image, so the azure-mirror
      # download that used to crawl past 10 minutes is gone.
      #
      # The AUTO blocks of rtl/<wrapper>.sv are written by emacs verilog-mode.
      # Regenerate each wrapper and fail if the committed file differs, so the
      # compiled wrapper cannot drift from the AUTO comments that are reviewed.
      - name: Regenerate every emacs wrapper and compare
        run: make wrap-check

  # ---------------------------------------------------------------------------
  connectivity:
    name: Connectivity
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # the report is posted as one PR comment, updated in place
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # For every block whose design/<block>/ changed: the top's ports, each
      # instance's pins and tie-offs, and a Mermaid diagram, from Verilator's
      # elaborated design. An open-source cross-check of the wrapper; the VCS
      # compile and the Verdi schematic on the training server stay the reference.
      # Fails on a floating instance input or an undriven top output.
      - name: Report the connectivity of each changed block
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          bash flow/conn/ci_report.sh "${BASE_SHA:-HEAD~1}"
          echo "rc=$?" >> "$GITHUB_ENV"
          set -e
          cat build/conn/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The container image has curl + jq, not the gh CLI.
          api="$GITHUB_API_URL/repos/$REPO"
          list_comments() {
            for page in $(seq 1 20); do
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/issues/$PR/comments?per_page=100&page=$page" | jq -c '.[]'
            done
          }
          title="**Connectivity, Verilator** (open-source cross-check; VCS and Verdi on the server are the reference)"
          if grep -q '^no block with RTL changed' build/conn/report.md; then exit 0; fi
          run="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          body=$(python3 flow/conn/ci_comment.py build/conn/report.md "$title" "$run")
          id=$(list_comments | jq -r --arg title "$title" 'select(.user.login == "github-actions[bot]" and (.body | startswith($title))) | .id' | tail -1)
          if [ -n "$id" ]; then
            jq -n --arg body "$body" '{body:$body}' | curl -fsS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/issues/comments/$id" -d @- > /dev/null
          else
            jq -n --arg body "$body" '{body:$body}' | curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/issues/$PR/comments" -d @- > /dev/null
          fi

      - name: Fail on a floating input or an undriven output
        run: test "$rc" = 0

  # ---------------------------------------------------------------------------
  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # the result is posted as one PR comment, updated in place
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every test of every changed block that has a testbench (dv/<block>/), and of
      # every block when code they all compile changed. A block with no testbench
      # yet is listed as skipped, never failed: the testbench is the SIM stage, not
      # a requirement of an RTL pull request (CONTRIBUTING.md, "Sign-off stages").
      - name: Simulate each changed block that has a testbench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          bash flow/sim/ci_sim.sh "${BASE_SHA:-HEAD~1}"
          echo "rc=$?" >> "$GITHUB_ENV"
          set -e
          cat build/sim/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The container image has curl + jq, not the gh CLI.
          api="$GITHUB_API_URL/repos/$REPO"
          list_comments() {
            for page in $(seq 1 20); do
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/issues/$PR/comments?per_page=100&page=$page" | jq -c '.[]'
            done
          }
          title="**Simulation, Verilator** (self-checking tests of dv/; VCS on the server checks X)"
          id=$(list_comments | jq -r --arg title "$title" 'select(.user.login == "github-actions[bot]" and (.body | startswith($title))) | .id' | tail -1)
          # Nothing simulated (no touched block has a testbench): no comment, and an
          # earlier one is removed so it cannot show a stale result. The job summary
          # still lists the skipped blocks.
          if [ "$(cat build/sim/ran 2>/dev/null || echo 0)" = 0 ]; then
            if [ -n "$id" ]; then
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" "$api/issues/comments/$id" > /dev/null
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s\n' "$title" "$(cat build/sim/report.md)")
          if [ -n "$id" ]; then
            jq -n --arg body "$body" '{body:$body}' | curl -fsS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/issues/comments/$id" -d @- > /dev/null
          else
            jq -n --arg body "$body" '{body:$body}' | curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/issues/$PR/comments" -d @- > /dev/null
          fi

      # The waveform of a failing block, to open in Surfer or GTKWave.
      - name: Keep the waveform of a failing block
        if: env.rc != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-waves
          path: build/sim/*/waves.vcd
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail on a failing test
        run: test "$rc" = 0

  # ---------------------------------------------------------------------------
  generated-ip:
    name: Generated IP
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # IP that ships templates and a generator (iDMA) has its output committed in
      # util/gen/<ip>/ with the recipe that made it: gen.sh and pinned tools. Run
      # every recipe on the vendored sources and fail if the committed files differ,
      # so the RTL that is reviewed is the RTL the upstream generator produces.
      - name: Regenerate every generated IP and compare
        run: make gen-check

  # ---------------------------------------------------------------------------
  hardcode:
    name: No hardcoded shared values
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The rule the anti-drift design rests on: a number shared between blocks is
      # imported from qnsc_pkg, never typed. A wrapper that writes 32'h8002_4000
      # instead of C_UART_0_BASE has created the next ROM-8-KiB-against-2-KiB, and
      # nothing else would notice.
      #
      # The check decides by comparison rather than by guessing: a literal equal to
      # a contract constant is wrong by construction, and one that lands inside a
      # mapped region is almost certainly an address. Scope is design/**/rtl, so
      # vendored IP and the generated package itself are excluded.
      - name: Check no shared value is hardcoded
        run: make hardcode

  # ---------------------------------------------------------------------------
  module-rules:
    name: IP and integration module rules
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # IP (every block not listed as integration in flow/lint/module_rules.yml)
      # does not use qnsc_pkg, a wrapper declares no parameter, and a file
      # expanded by emacs has no import. design/README.md explains why.
      - name: Check module rules
        run: make module-rules

  # ---------------------------------------------------------------------------
  contract-tags:
    name: Contract tags
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # IP writes a number it shares with the chip as a literal tagged
      # `// contract: <key>`. This fails every tagged line whose number no longer
      # equals util/qsoc_contract.yml, so the copy cannot drift.
      - name: Check every contract tag
        run: make contract-tags

  # ---------------------------------------------------------------------------
  contract:
    name: Inter-block contract
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Regenerate design/top/rtl/qnsc_pkg.sv from util/qsoc_contract.yml and fail
      # if the committed file differs. Every number in that package is shared by
      # more than one block, and each defect this project has paid for was one
      # fact written twice: ROM 8 KiB against 2 KiB, APB_M11 against APB_S11,
      # eleven interrupt sources against twelve. Generating instead of retyping
      # makes the disagreement impossible rather than merely detectable.
      - name: Check the generated package matches the contract
        run: make pkg-check

  # ---------------------------------------------------------------------------
  naming:
    name: RTL naming rule
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # QNSC_RTL_Design_Naming_Rule V1.2 is mandatory and entirely mechanical, so
      # it is enforced by a deterministic script rather than by review or by a
      # language model: this is a required check, and a gate that can return a
      # different verdict for the same input is worse than no gate.
      #
      # Violations are emitted as GitHub Actions annotations, so they appear
      # inline on the pull request diff at the offending line.
      #
      # Scope is design/**/rtl only. Vendored IP keeps its upstream conventions
      # and must not be renamed -- editing vendor/ is itself a CI failure.
      - name: Check naming against QNSC_RTL_Design_Naming_Rule V1.2
        run: make naming

  # ---------------------------------------------------------------------------
  vendor-guard:
    name: Vendor tree unmodified
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quynhonsemiconductor/qnsc-eda@sha256:e3ad00a1f912379fd89a5ff62edbfa57c868ee5871650881128dec33e8650626
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse edits to vendored IP outside a manifest update
        # Pass the base SHA through env rather than interpolating the GitHub
        # expression directly into the shell command (template-injection).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make vendor-guard BASE="${BASE_SHA:-HEAD~1}"
