<text x="610.0" y="37.0" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">TCK domain  ·  i_jtag_tck  ·  w_rst_n_tck = i_jtag_trst_n &amp; i_rst_n_por</text>
<text x="75.0" y="98.3" font-size="10" text-anchor="middle" fill="#000000">i_jtag_tms</text>
<text x="75.0" y="295.3" font-size="10" text-anchor="middle" fill="#000000">i_jtag_tdi</text>
<text x="1160.0" y="578.3" font-size="10" text-anchor="middle" fill="#000000">o_jtag_tdo</text>
<text x="1160.0" y="628.3" font-size="10" text-anchor="middle" fill="#000000">o_jtag_tdo_oe</text>
<text x="280.0" y="91.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">TAP FSM</text>
<text x="280.0" y="104.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">IEEE 1149.1, 16 states</text>
<text x="570.0" y="86.0" font-size="9" text-anchor="middle" fill="#000000">w_capture_ir  w_shift_ir  w_update_ir</text>
<text x="570.0" y="98.0" font-size="9" text-anchor="middle" fill="#000000">w_capture_dr  w_shift_dr  w_update_dr</text>
<text x="570.0" y="110.0" font-size="9" text-anchor="middle" fill="#000000">w_test_logic_reset</text>
<text x="280.0" y="196.8" font-size="10" text-anchor="middle" fill="#000000">IR shift  4 bit</text>
<text x="280.0" y="209.8" font-size="10" text-anchor="middle" fill="#000000">Capture-IR loads 0001</text>
<text x="570.0" y="191.0" font-size="9" text-anchor="middle" fill="#000000">r_ir  4 bit</text>
<text x="570.0" y="203.0" font-size="9" text-anchor="middle" fill="#000000">Update-IR loads shift</text>
<text x="570.0" y="215.0" font-size="9" text-anchor="middle" fill="#000000">Test-Logic-Reset loads 1110 (IDCODE)</text>
<text x="900.0" y="197.0" font-size="9" text-anchor="middle" fill="#000000">IR decode: one DR between TDI and TDO</text>
<text x="900.0" y="209.0" font-size="9" text-anchor="middle" fill="#000000">unlisted codes act as BYPASS</text>
<text x="280.0" y="289.0" font-size="9" text-anchor="middle" fill="#000000">ADDR 33   0100</text>
<text x="280.0" y="301.0" font-size="9" text-anchor="middle" fill="#000000">capture r_addr</text>
<text x="280.0" y="341.0" font-size="9" text-anchor="middle" fill="#000000">DATA 32   0101</text>
<text x="280.0" y="353.0" font-size="9" text-anchor="middle" fill="#000000">capture r_rdata_hold</text>
<text x="280.0" y="393.0" font-size="9" text-anchor="middle" fill="#000000">STATUS 3   0110</text>
<text x="280.0" y="405.0" font-size="9" text-anchor="middle" fill="#000000">capture {busy, r_resp}</text>
<text x="280.0" y="445.0" font-size="9" text-anchor="middle" fill="#000000">CPUDBG 1   0111</text>
<text x="280.0" y="457.0" font-size="9" text-anchor="middle" fill="#000000">capture r_dbgreq</text>
<text x="280.0" y="497.0" font-size="9" text-anchor="middle" fill="#000000">CPUHOLD 1   1000</text>
<text x="280.0" y="509.0" font-size="9" text-anchor="middle" fill="#000000">capture r_cpu_hold</text>
<text x="280.0" y="549.0" font-size="9" text-anchor="middle" fill="#000000">IDCODE 32   1110</text>
<text x="280.0" y="561.0" font-size="9" text-anchor="middle" fill="#000000">capture 0x0515_3001</text>
<text x="280.0" y="601.0" font-size="9" text-anchor="middle" fill="#000000">BYPASS 1   1111</text>
<text x="280.0" y="613.0" font-size="9" text-anchor="middle" fill="#000000">capture 0</text>
<text x="570.0" y="313.0" font-size="9" text-anchor="middle" fill="#000000">Update-DR, only when the IR selects it</text>
<text x="570.0" y="325.0" font-size="9" text-anchor="middle" fill="#000000"></text>
<text x="570.0" y="337.0" font-size="9" text-anchor="middle" fill="#000000">ADDR -&gt; r_addr[32:0]    if !busy</text>
<text x="570.0" y="349.0" font-size="9" text-anchor="middle" fill="#000000">DATA -&gt; r_wdata[31:0]   if !busy</text>
<text x="570.0" y="361.0" font-size="9" text-anchor="middle" fill="#000000">CPUDBG -&gt; r_dbgreq</text>
<text x="570.0" y="373.0" font-size="9" text-anchor="middle" fill="#000000">CPUHOLD -&gt; r_cpu_hold</text>
<text x="570.0" y="385.0" font-size="9" text-anchor="middle" fill="#000000"></text>
<text x="570.0" y="397.0" font-size="9" text-anchor="middle" fill="#000000">STATUS, IDCODE, BYPASS: nothing</text>
<text x="570.0" y="409.0" font-size="9" text-anchor="middle" fill="#000000"></text>
<text x="570.0" y="421.0" font-size="9" text-anchor="middle" fill="#000000">reset: r_addr 0, r_wdata 0,</text>
<text x="570.0" y="433.0" font-size="9" text-anchor="middle" fill="#000000">r_dbgreq 0, r_cpu_hold 1</text>
<text x="570.0" y="622.0" font-size="9" text-anchor="middle" fill="#000000">to page 3: request logic</text>
<text x="570.0" y="634.0" font-size="9" text-anchor="middle" fill="#000000">(read_req, write_req, busy)</text>
<text x="900.0" y="406.0" font-size="9" text-anchor="middle" fill="#000000">TDO select</text>
<text x="900.0" y="418.0" font-size="9" text-anchor="middle" fill="#000000">Shift-IR: IR shift bit 0</text>
<text x="900.0" y="430.0" font-size="9" text-anchor="middle" fill="#000000">Shift-DR: bit 0 of the selected DR</text>
<text x="900.0" y="572.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">TDO flip-flop on the FALLING edge of i_jtag_tck</text>
<text x="900.0" y="584.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">o_jtag_tdo_oe = 1 in Shift-IR, Shift-DR</text>
</svg>