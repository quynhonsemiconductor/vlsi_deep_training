<text x="420.0" y="89.0" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">The same 26 sources, three ways</text>
<text x="163.0" y="134.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">OR tree  --  this revision</text>
<text x="423.0" y="134.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Latched in-house  V2.0-V7.0</text>
<text x="680.0" y="134.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">rv_plic  V8.0-V10.1</text>
<text x="163.0" y="172.0" font-size="10" text-anchor="middle" fill="#000000">11 fast lines + NMI</text>
<text x="163.0" y="185.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="163.0" y="198.0" font-size="10" text-anchor="middle" fill="#000000">mcause names the peripheral</text>
<text x="163.0" y="211.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="163.0" y="224.0" font-size="10" text-anchor="middle" fill="#000000">0 bus access per interrupt</text>
<text x="163.0" y="237.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="163.0" y="250.0" font-size="10" text-anchor="middle" fill="#000000">COMBINATIONAL</text>
<text x="163.0" y="263.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="163.0" y="276.0" font-size="10" text-anchor="middle" fill="#000000">0 flip-flops</text>
<text x="163.0" y="289.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="163.0" y="302.0" font-size="10" text-anchor="middle" fill="#000000">no register, no address</text>
<text x="423.0" y="172.0" font-size="10" text-anchor="middle" fill="#000000">10 fast lines + NMI</text>
<text x="423.0" y="185.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="423.0" y="198.0" font-size="10" text-anchor="middle" fill="#000000">mcause names the peripheral</text>
<text x="423.0" y="211.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="423.0" y="224.0" font-size="10" text-anchor="middle" fill="#000000">1 bus access (W1C)</text>
<text x="423.0" y="237.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="423.0" y="250.0" font-size="10" text-anchor="middle" fill="#000000">1 cycle</text>
<text x="423.0" y="263.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="423.0" y="276.0" font-size="10" text-anchor="middle" fill="#000000">52 flip-flops</text>
<text x="423.0" y="289.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="423.0" y="302.0" font-size="10" text-anchor="middle" fill="#000000">6 registers on APB_M15</text>
<text x="680.0" y="172.0" font-size="10" text-anchor="middle" fill="#000000">1 line (irq_external) + NMI</text>
<text x="680.0" y="185.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="680.0" y="198.0" font-size="10" text-anchor="middle" fill="#000000">read the CLAIM register</text>
<text x="680.0" y="211.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="680.0" y="224.0" font-size="10" text-anchor="middle" fill="#000000">2 bus access, 1 blocking</text>
<text x="680.0" y="237.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="680.0" y="250.0" font-size="10" text-anchor="middle" fill="#000000">2 cycles</text>
<text x="680.0" y="263.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="680.0" y="276.0" font-size="10" text-anchor="middle" fill="#000000">258 flip-flops</text>
<text x="680.0" y="289.0" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="680.0" y="302.0" font-size="10" text-anchor="middle" fill="#000000">10 registers, 4 MiB on AXI_M4</text>
<text x="420.0" y="403.0" font-size="11" text-anchor="middle" fill="#000000">What the OR tree gives up, stated rather than hidden:</text>
<text x="420.0" y="417.0" font-size="11" text-anchor="middle" fill="#000000">1  a one-cycle pulse arriving while mstatus.MIE is clear is LOST -- recoverable for 10 of 11 pulse</text>
<text x="420.0" y="431.0" font-size="11" text-anchor="middle" fill="#000000">    sources, but NOT for DMA, which has no status register.  That is the one open dependency.</text>
<text x="420.0" y="445.0" font-size="11" text-anchor="middle" fill="#000000">2  priority is FIXED at elaboration: it is the fast-line index, resolved lowest-index-first by Ibex.</text>
<text x="420.0" y="459.0" font-size="11" text-anchor="middle" fill="#000000">3  mcause 16-30 is an Ibex extension, so firmware is tied to this core.</text>
</svg>