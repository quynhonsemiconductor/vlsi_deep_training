<text x="95.0" y="255.3" font-size="10" text-anchor="middle" fill="#000000">JTAG pads</text>
<text x="95.0" y="268.3" font-size="10" text-anchor="middle" fill="#000000">TCK  TMS</text>
<text x="95.0" y="281.3" font-size="10" text-anchor="middle" fill="#000000">TDI  TDO</text>
<text x="400.0" y="77.0" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">TCK clock domain</text>
<text x="400.0" y="142.8" font-size="10" text-anchor="middle" fill="#000000">TAP controller</text>
<text x="400.0" y="155.8" font-size="10" text-anchor="middle" fill="#000000">Capture-DR · Shift-DR · Update-DR</text>
<text x="400.0" y="267.8" font-size="10" text-anchor="middle" fill="#000000">ACCESS shift register  68 bit</text>
<text x="400.0" y="280.8" font-size="10" text-anchor="middle" fill="#000000">op[1:0] · size[1:0] · addr[31:0] · data[31:0]</text>
<text x="400.0" y="381.8" font-size="10" text-anchor="middle" fill="#000000">response latch</text>
<text x="400.0" y="394.8" font-size="10" text-anchor="middle" fill="#000000">rdata[31:0] · status[1:0]</text>
<text x="400.0" y="479.0" font-size="9" text-anchor="middle" fill="#000000">also in the chain:</text>
<text x="400.0" y="491.0" font-size="9" text-anchor="middle" fill="#000000">IR 4 bit · IDCODE 32 bit · BYPASS 1 bit</text>
<text x="685.0" y="316.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">CDC</text>
<text x="685.0" y="329.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">req / ack</text>
<text x="685.0" y="342.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">2-flop sync</text>
<text x="995.0" y="77.0" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">system clock domain</text>
<text x="995.0" y="142.8" font-size="10" text-anchor="middle" fill="#000000">Command FSM</text>
<text x="995.0" y="155.8" font-size="10" text-anchor="middle" fill="#000000">IDLE · DECODE · LOCAL / BUS · DONE</text>
<text x="887.5" y="268.0" font-size="9" text-anchor="middle" fill="#000000">SYSDBG registers</text>
<text x="887.5" y="280.0" font-size="9" text-anchor="middle" fill="#000000">CTRL · STATUS · ID</text>
<text x="1102.5" y="268.0" font-size="9" text-anchor="middle" fill="#000000">debug_req logic</text>
<text x="1102.5" y="280.0" font-size="9" text-anchor="middle" fill="#000000">CTRL[0] in, halt status out</text>
<text x="995.0" y="392.8" font-size="10" text-anchor="middle" fill="#000000">Bus master</text>
<text x="995.0" y="405.8" font-size="10" text-anchor="middle" fill="#000000">req · gnt · rsp_valid · be</text>
<text x="1342.5" y="254.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">Ibex CPU</text>
<text x="1342.5" y="392.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">S_BUS</text>
<text x="1342.5" y="406.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">AXI_S0</text>
<text x="722.5" y="597.0" font-size="11" text-anchor="middle" fill="#000000">1  host shifts op, addr and data in on TDI</text>
<text x="722.5" y="611.0" font-size="11" text-anchor="middle" fill="#000000">2  at Update-DR the 68 bits are latched as one command</text>
<text x="722.5" y="625.0" font-size="11" text-anchor="middle" fill="#000000">3  the command crosses into the system clock domain</text>
<text x="722.5" y="639.0" font-size="11" text-anchor="middle" fill="#000000">4  the FSM executes it: local register, or a bus request</text>
<text x="722.5" y="653.0" font-size="11" text-anchor="middle" fill="#000000">5  rdata and status travel back across the CDC</text>
<text x="722.5" y="667.0" font-size="11" text-anchor="middle" fill="#000000">6  they are captured at the next Capture-DR</text>
<text x="722.5" y="681.0" font-size="11" text-anchor="middle" fill="#000000">7  the host shifts them out on TDO</text>
</svg>