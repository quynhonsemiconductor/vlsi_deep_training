<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="954" viewBox="36 16 1008 954" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000000"/></marker><marker id="ahs" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" fill="#000000"/></marker></defs>
<rect x="36" y="16" width="1008" height="954" fill="#ffffff"/>
<rect x="60" y="40" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="144" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="248" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="352" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.8"/>
<rect x="60" y="456" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="560" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="664" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="768" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="60" y="872" width="600" height="74" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="720" y="40" width="300" height="340" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="720" y="420" width="300" height="200" rx="3" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="360.0,114.0 360.0,144.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,218.0 360.0,248.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,322.0 360.0,352.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,426.0 360.0,456.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,530.0 360.0,560.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,634.0 360.0,664.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,738.0 360.0,768.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="360.0,842.0 360.0,872.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="360.0" y="80.7" font-size="11" text-anchor="middle" fill="#000000">1.  PC:  halt()</text>
<text x="360.0" y="177.7" font-size="11" text-anchor="middle" fill="#000000">2.  PC:  write(0xF000_0000, 0x1)</text>
<text x="360.0" y="191.7" font-size="11" text-anchor="middle" fill="#000000">becomes one 68-bit DR scan</text>
<text x="360.0" y="281.7" font-size="11" text-anchor="middle" fill="#000000">3.  JTAG:  op = WRITE, addr = 0xF000_0000, data = 1</text>
<text x="360.0" y="295.7" font-size="11" text-anchor="middle" fill="#000000">latched at Update-DR</text>
<text x="360.0" y="392.7" font-size="11" text-anchor="middle" fill="#000000">4.  CDC:  the command crosses to the system clock</text>
<text x="360.0" y="489.7" font-size="11" text-anchor="middle" fill="#000000">5.  FSM:  DECODE sees addr[31:28] = F, goes to LOCAL,</text>
<text x="360.0" y="503.7" font-size="11" text-anchor="middle" fill="#000000">writes CTRL[0] = 1</text>
<text x="360.0" y="600.7" font-size="11" text-anchor="middle" fill="#000000">6.  SYSDBG:  debug_req driven high and HELD high</text>
<text x="360.0" y="697.7" font-size="11" text-anchor="middle" fill="#000000">7.  Ibex:  saves PC to dpc, sets dcsr.cause = 3,</text>
<text x="360.0" y="711.7" font-size="11" text-anchor="middle" fill="#000000">jumps to DmHaltAddr, raises debug_mode</text>
<text x="360.0" y="808.7" font-size="11" text-anchor="middle" fill="#000000">8.  SYSDBG:  STATUS[2] = 1</text>
<text x="360.0" y="905.7" font-size="11" text-anchor="middle" fill="#000000">9.  PC:  read(0xF000_0004), two scans, sees bit 2 set</text>
<text x="360.0" y="919.7" font-size="11" text-anchor="middle" fill="#000000">the CPU is halted</text>
<text x="870.0" y="57.0" font-size="11" text-anchor="middle" fill="#000000">Colour = who is acting</text>
<text x="870.0" y="71.0" font-size="11" text-anchor="middle" fill="#000000"></text>
<text x="870.0" y="85.0" font-size="11" text-anchor="middle" fill="#000000">blue    the PC</text>
<text x="870.0" y="99.0" font-size="11" text-anchor="middle" fill="#000000">purple  the TCK domain</text>
<text x="870.0" y="113.0" font-size="11" text-anchor="middle" fill="#000000">red     the clock crossing</text>
<text x="870.0" y="127.0" font-size="11" text-anchor="middle" fill="#000000">yellow  SYSDBG, system clock</text>
<text x="870.0" y="141.0" font-size="11" text-anchor="middle" fill="#000000">green   the CPU</text>
<text x="870.0" y="155.0" font-size="11" text-anchor="middle" fill="#000000"></text>
<text x="870.0" y="169.0" font-size="11" text-anchor="middle" fill="#000000">Steps 1-6 are the command path.</text>
<text x="870.0" y="183.0" font-size="11" text-anchor="middle" fill="#000000">Step 7 is the CPU reacting.</text>
<text x="870.0" y="197.0" font-size="11" text-anchor="middle" fill="#000000">Steps 8-9 are how the host</text>
<text x="870.0" y="211.0" font-size="11" text-anchor="middle" fill="#000000">finds out it worked.</text>
<text x="870.0" y="474.7" font-size="11" text-anchor="middle" fill="#000000">Resume is the same path</text>
<text x="870.0" y="488.7" font-size="11" text-anchor="middle" fill="#000000">with CTRL[1] instead,</text>
<text x="870.0" y="502.7" font-size="11" text-anchor="middle" fill="#000000">and the core returns</text>
<text x="870.0" y="516.7" font-size="11" text-anchor="middle" fill="#000000">through DRET.</text>
<text x="870.0" y="530.7" font-size="11" text-anchor="middle" fill="#000000"></text>
<text x="870.0" y="544.7" font-size="11" text-anchor="middle" fill="#000000">Reading memory is the same</text>
<text x="870.0" y="558.7" font-size="11" text-anchor="middle" fill="#000000">path with op = READ and an</text>
<text x="870.0" y="572.7" font-size="11" text-anchor="middle" fill="#000000">address that is not 0xF...</text>
</svg>