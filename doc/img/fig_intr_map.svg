<text x="721.0" y="265.3" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold"></text>
<text x="721.0" y="281.3" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">RV32IMC</text>
<text x="721.0" y="297.3" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold"></text>
<text x="721.0" y="313.3" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">vectored</text>
<text x="721.0" y="329.3" font-size="13" text-anchor="middle" fill="#000000" font-weight="bold">mtvec</text>
<text x="290.0" y="91.0" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">INTMAP</text>
<text x="418.0" y="691.0" font-size="11" text-anchor="middle" fill="#000000">INTMAP = 11 OR gates. No clock, no reset, no register, no address, no bus port, ZERO flip-flops.</text>
<text x="418.0" y="705.0" font-size="11" text-anchor="middle" fill="#000000">mcause = 16 + line, and mtvec is permanently vectored, so the trap address is mtvec + 4 x mcause</text>
<text x="418.0" y="719.0" font-size="11" text-anchor="middle" fill="#000000">-&gt; the core lands INSIDE that peripheral&#x27;s handler with no register read on the path.</text>
<text x="418.0" y="733.0" font-size="11" text-anchor="middle" fill="#000000">irq_external_i, irq_timer_i, irq_software_i are tied 0.  Lines 11-14 spare.</text>
