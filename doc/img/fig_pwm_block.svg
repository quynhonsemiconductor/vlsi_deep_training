<text x="270.0" y="485.7" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">ch_0_o[3:0] .. ch_3_o[3:0]</text>
<text x="730.0" y="471.7" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">events_o[3:0]</text>
