<text x="490.0" y="74.3" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">P_BUS  (APB, 20 MHz)</text>
<text x="490.0" y="271.5" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">PWM   apb_adv_timer   APB_M13   0x8003_4000   D18, bit 15</text>
