<text x="190.0" y="303.3" font-size="10" text-anchor="middle" fill="#111">16-bit counter</text>
<text x="190.0" y="316.3" font-size="10" text-anchor="middle" fill="#111">4 comparators</text>
<text x="390.0" y="290.3" font-size="10" text-anchor="middle" fill="#111">timer_module 1</text>
<text x="390.0" y="303.3" font-size="10" text-anchor="middle" fill="#111">16-bit counter</text>
<text x="390.0" y="316.3" font-size="10" text-anchor="middle" fill="#111">4 comparators</text>
<text x="590.0" y="290.3" font-size="10" text-anchor="middle" fill="#111">timer_module 2</text>
<text x="590.0" y="303.3" font-size="10" text-anchor="middle" fill="#111">16-bit counter</text>
<text x="590.0" y="316.3" font-size="10" text-anchor="middle" fill="#111">4 comparators</text>
<text x="790.0" y="290.3" font-size="10" text-anchor="middle" fill="#111">timer_module 3</text>
<text x="790.0" y="303.3" font-size="10" text-anchor="middle" fill="#111">16-bit counter</text>
<text x="790.0" y="316.3" font-size="10" text-anchor="middle" fill="#111">4 comparators</text>
