<text x="730.0" y="607.7" font-size="11" text-anchor="middle" fill="#111">INTMAP -&gt; fast line 7</text>
<text x="730.0" y="621.7" font-size="11" text-anchor="middle" fill="#111">4 sources, 1-cycle pulses</text>
