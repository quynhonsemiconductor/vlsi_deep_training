<svg xmlns="http://www.w3.org/2000/svg" width="988" height="578" viewBox="16 16 988 578" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000000"/></marker><marker id="ahs" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" fill="#000000"/></marker></defs>
<rect x="16" y="16" width="988" height="578" fill="#ffffff"/>
<rect x="40" y="40" width="940" height="34" rx="3" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="40" y="90" width="90" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.8"/>
<rect x="140" y="90" width="90" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="240" y="90" width="330" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="580" y="90" width="400" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="230" width="940" height="34" rx="3" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="40" y="280" width="700" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="760" y="280" width="220" height="84" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="420" width="940" height="150" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="510.0" y="61.0" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">shifted IN on TDI  |  68 bits</text>
<text x="85.0" y="128.7" font-size="11" text-anchor="middle" fill="#000000">op</text>
<text x="85.0" y="142.7" font-size="11" text-anchor="middle" fill="#000000">[1:0]</text>
<text x="185.0" y="128.7" font-size="11" text-anchor="middle" fill="#000000">size</text>
<text x="185.0" y="142.7" font-size="11" text-anchor="middle" fill="#000000">[1:0]</text>
<text x="405.0" y="128.7" font-size="11" text-anchor="middle" fill="#000000">addr</text>
<text x="405.0" y="142.7" font-size="11" text-anchor="middle" fill="#000000">[31:0]</text>
<text x="780.0" y="128.7" font-size="11" text-anchor="middle" fill="#000000">data</text>
<text x="780.0" y="142.7" font-size="11" text-anchor="middle" fill="#000000">[31:0]</text>
<text x="510.0" y="251.0" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">shifted OUT on TDO  |  same scan</text>
<text x="390.0" y="318.7" font-size="11" text-anchor="middle" fill="#000000">rdata [31:0]</text>
<text x="390.0" y="332.7" font-size="11" text-anchor="middle" fill="#000000">result of the PREVIOUS command</text>
<text x="870.0" y="318.7" font-size="11" text-anchor="middle" fill="#000000">status</text>
<text x="870.0" y="332.7" font-size="11" text-anchor="middle" fill="#000000">[1:0]</text>
<text x="510.0" y="463.7" font-size="11" text-anchor="middle" fill="#000000">op:  00 = NOP   |   01 = READ   |   10 = WRITE</text>
<text x="510.0" y="477.7" font-size="11" text-anchor="middle" fill="#000000">size:  00 = byte   |   01 = halfword   |   10 = word   -&gt;  drives mem_be_o</text>
<text x="510.0" y="491.7" font-size="11" text-anchor="middle" fill="#000000">status:  00 = OK   |   01 = BUSY   |   10 = ERROR</text>
<text x="510.0" y="505.7" font-size="11" text-anchor="middle" fill="#000000">addr[31:28] = 0xF  -&gt;  SYSDBG registers   |   otherwise  -&gt;  system bus</text>
<text x="510.0" y="519.7" font-size="11" text-anchor="middle" fill="#000000">the payload always sits in the LOW bits of data: hardware shifts it into the addressed lane</text>
<text x="510.0" y="533.7" font-size="11" text-anchor="middle" fill="#000000">one scan = one command, and the answer arrives on the next scan</text>
</svg>