<text x="190.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Reset source: POR, WDT bite or SW_RST</text>
<text x="190.0" y="88.8" font-size="10" text-anchor="middle" fill="#000000">RRC: w_rst_n_sys = 0 for 16 cycles</text>
<text x="190.0" y="101.8" font-size="10" text-anchor="middle" fill="#000000">WDT / SW cause set in SYSCSR</text>
<text x="190.0" y="157.3" font-size="10" text-anchor="middle" fill="#000000">SCRC CSR at reset values: RST_REL = 0,</text>
<text x="190.0" y="170.3" font-size="10" text-anchor="middle" fill="#000000">ICG_EN = 0, APB_BLK = 0x3_87F8</text>
<text x="190.0" y="183.3" font-size="10" text-anchor="middle" fill="#000000">every domain except sysdbg in reset</text>
<text x="190.0" y="245.3" font-size="10" text-anchor="middle" fill="#000000">1. ICG_EN &lt;- CLK_EN  (all clocks but timer_1)</text>
<text x="190.0" y="315.3" font-size="10" text-anchor="middle" fill="#000000">2. wait &gt;= 3 cycles</text>
<text x="190.0" y="385.3" font-size="10" text-anchor="middle" fill="#000000">3. RST_REL &lt;- every domain except the CPU</text>
<text x="190.0" y="455.3" font-size="10" text-anchor="middle" fill="#000000">4. wait &gt;= 16 cycles</text>
<text x="190.0" y="525.3" font-size="10" text-anchor="middle" fill="#000000">5. APB_BLK &lt;- NOT CLK_EN  (guards open)</text>
<text x="190.0" y="595.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">6. RST_REL[CPU] &lt;- 1  (CPU released last)</text>
<text x="190.0" y="675.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">IDLE: read CLK_EN</text>
<text x="190.0" y="761.8" font-size="10" text-anchor="middle" fill="#000000">CLK_EN</text>
<text x="190.0" y="774.8" font-size="10" text-anchor="middle" fill="#000000">changed?</text>
<text x="605.0" y="761.8" font-size="10" text-anchor="middle" fill="#000000">stop: APB_BLK = 1, wait APB_BUSY = 0, ICG_EN = 0</text>
<text x="605.0" y="774.8" font-size="10" text-anchor="middle" fill="#000000">start: ICG_EN = 1, wait 3, APB_BLK = 0</text>
<text x="605.0" y="588.8" font-size="10" text-anchor="middle" fill="#000000">Ibex starts when i_dbg_cpu_hold = 0</text>
<text x="605.0" y="601.8" font-size="10" text-anchor="middle" fill="#000000">(QNSC_BOOT_SPEC)</text>
<text x="605.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000">WDT bite or Ibex writes SW_RST, at any time</text>
<text x="0.5" y="763.8" font-size="10" text-anchor="middle" fill="#000000"></text>
<text x="840.5" y="763.8" font-size="10" text-anchor="middle" fill="#000000"></text>
