<svg xmlns="http://www.w3.org/2000/svg" width="908" height="598" viewBox="16 16 908 598" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000000"/></marker><marker id="ahs" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" fill="#000000"/></marker></defs>
<rect x="16" y="16" width="908" height="598" fill="#ffffff"/>
<rect x="40" y="40" width="400" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="160" width="400" height="90" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="290" width="400" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="410" width="400" height="70" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="40" y="520" width="400" height="70" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="540" y="520" width="360" height="70" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<rect x="540" y="410" width="360" height="70" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.8"/>
<rect x="540" y="40" width="360" height="330" rx="3" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="240.0,120.0 240.0,160.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="240.0,250.0 240.0,290.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="240.0,370.0 240.0,410.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="240.0,480.0 240.0,520.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="440.0,555.0 540.0,555.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="720.0,520.0 720.0,480.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="240.0" y="76.5" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">Our debug application</text>
<text x="240.0" y="91.5" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">halt, load, dump, run</text>
<text x="240.0" y="194.7" font-size="11" text-anchor="middle" fill="#000000">SYSDBG API</text>
<text x="240.0" y="208.7" font-size="11" text-anchor="middle" fill="#000000">read(addr) · write(addr, val)</text>
<text x="240.0" y="222.7" font-size="11" text-anchor="middle" fill="#000000">halt() · resume()</text>
<text x="240.0" y="326.7" font-size="11" text-anchor="middle" fill="#000000">JTAG layer</text>
<text x="240.0" y="340.7" font-size="11" text-anchor="middle" fill="#000000">ir_scan() · dr_scan()</text>
<text x="240.0" y="448.7" font-size="11" text-anchor="middle" fill="#000000">libftdi (MPSSE mode)</text>
<text x="240.0" y="558.7" font-size="11" text-anchor="middle" fill="#000000">USB</text>
<text x="720.0" y="558.7" font-size="11" text-anchor="middle" fill="#000000">FT2232H board</text>
<text x="720.0" y="449.0" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">QSOC JTAG pins</text>
<text x="720.0" y="145.7" font-size="11" text-anchor="middle" fill="#000000">Each API call becomes</text>
<text x="720.0" y="159.7" font-size="11" text-anchor="middle" fill="#000000">one 68-bit DR scan.</text>
<text x="720.0" y="173.7" font-size="11" text-anchor="middle" fill="#000000"></text>
<text x="720.0" y="187.7" font-size="11" text-anchor="middle" fill="#000000">read() needs two scans:</text>
<text x="720.0" y="201.7" font-size="11" text-anchor="middle" fill="#000000">one to send the command,</text>
<text x="720.0" y="215.7" font-size="11" text-anchor="middle" fill="#000000">one to collect rdata.</text>
<text x="720.0" y="229.7" font-size="11" text-anchor="middle" fill="#000000"></text>
<text x="720.0" y="243.7" font-size="11" text-anchor="middle" fill="#000000">Same reason JTAG</text>
<text x="720.0" y="257.7" font-size="11" text-anchor="middle" fill="#000000">returns the PREVIOUS</text>
<text x="720.0" y="271.7" font-size="11" text-anchor="middle" fill="#000000">result, not this one.</text>
</svg>