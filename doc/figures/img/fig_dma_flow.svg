<text x="205.0" y="385.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">line 0 taken: DMA idle</text>
<text x="205.0" y="468.3" font-size="10" text-anchor="middle" fill="#000000">DONE_ID &gt;= id?</text>
<text x="205.0" y="565.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">clear mie[16]; job complete</text>
