<text x="205.0" y="88.8" font-size="10" text-anchor="middle" fill="#000000">write SRC, DST, LENGTH</text>
<text x="205.0" y="101.8" font-size="10" text-anchor="middle" fill="#000000">and for 2D: SRC_STRIDE, DST_STRIDE, REPS</text>
