<text x="205.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Power on</text>
<text x="205.0" y="88.8" font-size="10" text-anchor="middle" fill="#000000">SCRC holds the chip in reset</text>
<text x="205.0" y="101.8" font-size="10" text-anchor="middle" fill="#000000">and clocks every block (7.3)</text>
<text x="205.0" y="158.8" font-size="10" text-anchor="middle" fill="#000000">SCRC releases every IP except the CPU,</text>
<text x="205.0" y="171.8" font-size="10" text-anchor="middle" fill="#000000">waits 16 clock cycles (7.5)</text>
<text x="205.0" y="235.3" font-size="10" text-anchor="middle" fill="#000000">SCRC releases the CPU</text>
<text x="205.0" y="298.8" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x0000_0080 (ROM)</text>
<text x="205.0" y="311.8" font-size="10" text-anchor="middle" fill="#000000">_start: sp = 0x3000_8000, boot_main</text>
<text x="205.0" y="375.3" font-size="10" text-anchor="middle" fill="#000000">init UART0 (19200 8N1), send QRDY</text>
<text x="205.0" y="438.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">download frame to ISRAM</text>
<text x="205.0" y="451.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">(Figure 7-1)</text>
<text x="205.0" y="521.8" font-size="10" text-anchor="middle" fill="#000000">ACKP</text>
<text x="205.0" y="534.8" font-size="10" text-anchor="middle" fill="#000000">sent?</text>
<text x="205.0" y="631.8" font-size="10" text-anchor="middle" fill="#000000">SYSCSR.DBG_EN</text>
<text x="205.0" y="644.8" font-size="10" text-anchor="middle" fill="#000000">= 1?</text>
<text x="205.0" y="735.3" font-size="10" text-anchor="middle" fill="#000000">wait TEMT, fence.i, jump to 0x2000_1080</text>
<text x="205.0" y="805.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">user program runs from ISRAM</text>
<text x="640.0" y="618.8" font-size="10" text-anchor="middle" fill="#000000">ROM polling loop, CPU not held in reset</text>
<text x="640.0" y="631.8" font-size="10" text-anchor="middle" fill="#000000">JTAG cpu_dbg_en: debug at 0x2000_0800,</text>
<text x="640.0" y="644.8" font-size="10" text-anchor="middle" fill="#000000">dret returns here</text>
<text x="640.0" y="657.8" font-size="10" text-anchor="middle" fill="#000000">JTAG writes DBG_EN_MASK = 1: DBG_EN reads 0</text>
<text x="560.0" y="528.3" font-size="10" text-anchor="middle" fill="#000000">failure token, drain, QRDY</text>
</svg>