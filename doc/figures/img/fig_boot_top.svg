<text x="512.5" y="558.0" font-size="10" fill="#000000" text-anchor="middle">1: debug boot</text>
<polyline points="885.0,533.0 885.0,505.0 205.0,505.0 205.0,520.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="205.0,590.0 205.0,660.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="160.0" y="617.0" width="90.0" height="14" fill="#ffffff"/>
<text x="205.0" y="628.0" font-size="10" fill="#000000" text-anchor="middle">0: normal boot</text>
<polyline points="205.0,704.0 205.0,730.0" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="205.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Power on</text>
<text x="205.0" y="95.3" font-size="10" text-anchor="middle" fill="#000000">SCRC: hold the whole chip in reset, clock the IPs</text>
<text x="205.0" y="165.3" font-size="10" text-anchor="middle" fill="#000000">SCRC: release the reset of every IP except the CPU</text>
<text x="205.0" y="235.3" font-size="10" text-anchor="middle" fill="#000000">SCRC releases the CPU reset</text>
<text x="205.0" y="305.3" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x0000_0080 (ROM)</text>
<text x="545.0" y="299.2" font-size="8" text-anchor="middle" fill="#000000">no boot address mux and no CPU hold:</text>
<text x="545.0" y="310.2" font-size="8" text-anchor="middle" fill="#000000">normal and debug boot both run the ROM</text>
<text x="205.0" y="375.3" font-size="10" text-anchor="middle" fill="#000000">init UART0 (19200 - 8N1 - polling)</text>
<text x="205.0" y="440.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">receive the frame from the PC over UART0</text>
<text x="205.0" y="452.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">(Figure 7-1):</text>
<text x="205.0" y="464.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">DEBUG_PAYLOAD -&gt; 0x2000_0000 (if DEBUG_PROG = 0x55)</text>
<text x="205.0" y="476.0" font-size="9" text-anchor="middle" fill="#000000" font-weight="bold">PAYLOAD -&gt; 0x2000_1000</text>
<text x="205.0" y="558.3" font-size="10" text-anchor="middle" fill="#000000">SYSCSR.DBG_EN = 1?</text>
<text x="885.0" y="551.8" font-size="10" text-anchor="middle" fill="#000000">CPU polling: read SYSCSR.DBG_EN again</text>
<text x="885.0" y="564.8" font-size="10" text-anchor="middle" fill="#000000">(the CPU runs the ROM; it is not held in reset)</text>
<text x="885.0" y="606.2" font-size="8" text-anchor="middle" fill="#000000">leaves the loop when the host writes DBG_BOOT.dbg_en_mask = 1</text>
<text x="885.0" y="617.2" font-size="8" text-anchor="middle" fill="#000000">(SYSDBG bus master, AXI_S0)</text>
<text x="885.0" y="628.2" font-size="8" text-anchor="middle" fill="#000000">at any time: debug request -&gt; debug program at 0x2000_0800,</text>
<text x="885.0" y="639.2" font-size="8" text-anchor="middle" fill="#000000">dret -&gt; back to this loop</text>
<text x="545.0" y="612.2" font-size="8" text-anchor="middle" fill="#000000">DBG_EN = DBG_EN pin through 2 FF,</text>
<text x="545.0" y="623.2" font-size="8" text-anchor="middle" fill="#000000">forced to 0 while dbg_en_mask = 1</text>
<text x="205.0" y="685.3" font-size="10" text-anchor="middle" fill="#000000">jump to 0x2000_1080 (ISRAM)</text>
<text x="205.0" y="755.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">application runs from ISRAM</text>
</svg>