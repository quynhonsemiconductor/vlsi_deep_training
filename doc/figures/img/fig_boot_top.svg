<text x="205.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Power on</text>
<text x="205.0" y="95.3" font-size="10" text-anchor="middle" fill="#000000">SCRC: hold the whole chip in reset, clock the IPs</text>
<text x="205.0" y="165.3" font-size="10" text-anchor="middle" fill="#000000">SCRC: release the reset of every IP except the CPU</text>
<text x="205.0" y="248.3" font-size="10" text-anchor="middle" fill="#000000">DBG_EN pin = 1?</text>
<text x="545.0" y="268.2" font-size="8" text-anchor="middle" fill="#000000">boot address picked by a hardware mux (o_dbg_en -&gt; boot_addr_i),</text>
<text x="545.0" y="279.2" font-size="8" text-anchor="middle" fill="#000000">in debug boot the ROM never runs</text>
<text x="205.0" y="345.3" font-size="10" text-anchor="middle" fill="#000000">SCRC releases the CPU reset</text>
<text x="205.0" y="415.3" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x0000_0080 (ROM)</text>
<text x="205.0" y="485.3" font-size="10" text-anchor="middle" fill="#000000">init UART0 (19200 - 8N1 - polling)</text>
<text x="205.0" y="550.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">receive the frame from the PC over UART0</text>
<text x="205.0" y="563.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">and write it to 0x2000_1000 (ISRAM)</text>
<text x="205.0" y="576.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">(Figure 7-1)</text>
<text x="205.0" y="645.3" font-size="10" text-anchor="middle" fill="#000000">jump to 0x2000_1080 (ISRAM)</text>
<text x="205.0" y="715.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">application runs from ISRAM</text>
<text x="885.0" y="235.3" font-size="10" text-anchor="middle" fill="#000000">SYSDBG holds the CPU in reset,</text>
<text x="885.0" y="248.3" font-size="10" text-anchor="middle" fill="#000000">the debug program is loaded to</text>
<text x="885.0" y="261.3" font-size="10" text-anchor="middle" fill="#000000">0x2000_1000 (ISRAM) over JTAG</text>
<text x="885.0" y="485.3" font-size="10" text-anchor="middle" fill="#000000">SYSDBG releases the CPU reset</text>
<text x="885.0" y="645.3" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x2000_1080 (ISRAM)</text>
</svg>