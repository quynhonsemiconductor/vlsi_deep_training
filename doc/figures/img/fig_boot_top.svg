<text x="205.0" y="25.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">Reset: POR, WDT bite or SW_RST</text>
<text x="205.0" y="88.8" font-size="10" text-anchor="middle" fill="#000000">SCRC: chip reset, then power-up</text>
<text x="205.0" y="101.8" font-size="10" text-anchor="middle" fill="#000000">(QNSC_SCRC_MAS 7.3, 7.5)</text>
<text x="205.0" y="171.8" font-size="10" text-anchor="middle" fill="#000000">DBG_EN</text>
<text x="205.0" y="184.8" font-size="10" text-anchor="middle" fill="#000000">captured = 1?</text>
<text x="545.0" y="198.2" font-size="8" text-anchor="middle" fill="#000000">boot address picked by a hardware mux (o_dbg_en -&gt; boot_addr_i),</text>
<text x="545.0" y="209.2" font-size="8" text-anchor="middle" fill="#000000">not by ROM code: in debug boot the ROM never runs</text>
<text x="205.0" y="275.3" font-size="10" text-anchor="middle" fill="#000000">SCRC release CPU</text>
<text x="205.0" y="345.3" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x0000_0080 (ROM)</text>
<text x="205.0" y="415.3" font-size="10" text-anchor="middle" fill="#000000">init UART0 (19200 - 8N1 - polling)</text>
<text x="205.0" y="478.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">download frame to ISRAM</text>
<text x="205.0" y="491.8" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">(Figure 7-1)</text>
<text x="205.0" y="561.8" font-size="10" text-anchor="middle" fill="#000000">CRC</text>
<text x="205.0" y="574.8" font-size="10" text-anchor="middle" fill="#000000">pass?</text>
<text x="205.0" y="665.3" font-size="10" text-anchor="middle" fill="#000000">jump to ENTRY</text>
<text x="205.0" y="735.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">application runs from ISRAM</text>
<text x="885.0" y="165.3" font-size="10" text-anchor="middle" fill="#000000">SYSDBG holds the CPU</text>
<text x="885.0" y="178.3" font-size="10" text-anchor="middle" fill="#000000">host writes the image over JTAG</text>
<text x="885.0" y="191.3" font-size="10" text-anchor="middle" fill="#000000">then CPUHOLD = 0 (QNSC_SYSDBG_MAS 7.1)</text>
<text x="885.0" y="415.3" font-size="10" text-anchor="middle" fill="#000000">SYSDBG release CPU</text>
<text x="885.0" y="665.3" font-size="10" text-anchor="middle" fill="#000000">Ibex fetches 0x2000_1080 (ISRAM)</text>
<text x="550.0" y="568.3" font-size="10" text-anchor="middle" fill="#000000">failure token, drain, QRDY</text>
</svg>