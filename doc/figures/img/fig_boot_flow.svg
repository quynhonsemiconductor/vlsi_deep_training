<text x="155.0" y="99.3" font-size="10" text-anchor="middle" fill="#000000">waiting for each MAGIC byte from PC</text>
<text x="155.0" y="170.8" font-size="10" text-anchor="middle" fill="#000000">last 4 bytes</text>
<text x="155.0" y="183.8" font-size="10" text-anchor="middle" fill="#000000">= &#x27;Q&#x27; &#x27;S&#x27; &#x27;O&#x27; &#x27;C&#x27;?</text>
<text x="155.0" y="248.8" font-size="10" text-anchor="middle" fill="#000000">waiting for the next header byte</text>
<text x="155.0" y="261.8" font-size="10" text-anchor="middle" fill="#000000">LENGTH, LOAD_ADDR, ENTRY, HDR_CRC</text>
<text x="155.0" y="333.3" font-size="10" text-anchor="middle" fill="#000000">UART error?</text>
<text x="155.0" y="416.8" font-size="10" text-anchor="middle" fill="#000000">byte within</text>
<text x="155.0" y="429.8" font-size="10" text-anchor="middle" fill="#000000">RX_TIMEOUT polls?</text>
<text x="155.0" y="500.3" font-size="10" text-anchor="middle" fill="#000000">16 header bytes</text>
<text x="155.0" y="513.3" font-size="10" text-anchor="middle" fill="#000000">includes HDR_CRC</text>
<text x="155.0" y="526.3" font-size="10" text-anchor="middle" fill="#000000">received?</text>
<text x="155.0" y="603.3" font-size="10" text-anchor="middle" fill="#000000">CRC32 = HDR_CRC?</text>
<text x="155.0" y="686.8" font-size="10" text-anchor="middle" fill="#000000">fields in range?</text>
<text x="155.0" y="699.8" font-size="10" text-anchor="middle" fill="#000000">(Table 6-1)</text>
<text x="155.0" y="771.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send ACKH</text>
<text x="155.0" y="830.8" font-size="10" text-anchor="middle" fill="#000000">wait for the next payload byte;</text>
<text x="155.0" y="843.8" font-size="10" text-anchor="middle" fill="#000000">every 4 payload bytes: word to ISRAM, CRC32</text>
<text x="155.0" y="915.3" font-size="10" text-anchor="middle" fill="#000000">UART error?</text>
<text x="155.0" y="998.8" font-size="10" text-anchor="middle" fill="#000000">byte within</text>
<text x="155.0" y="1011.8" font-size="10" text-anchor="middle" fill="#000000">RX_TIMEOUT polls?</text>
<text x="155.0" y="1088.8" font-size="10" text-anchor="middle" fill="#000000">LENGTH payload bytes and</text>
<text x="155.0" y="1101.8" font-size="10" text-anchor="middle" fill="#000000">PAY_CRC received?</text>
<text x="155.0" y="1185.3" font-size="10" text-anchor="middle" fill="#000000">CRC32 = PAY_CRC?</text>
<text x="155.0" y="1263.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send ACKP</text>
<text x="155.0" y="1329.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">jump to ENTRY</text>
<text x="610.0" y="99.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send QRDY</text>
<text x="610.0" y="242.3" font-size="10" text-anchor="middle" fill="#000000">clear RX FIFO,</text>
<text x="610.0" y="255.3" font-size="10" text-anchor="middle" fill="#000000">discard bytes until quiet</text>
<text x="610.0" y="268.3" font-size="10" text-anchor="middle" fill="#000000">for DRAIN_IDLE</text>
<text x="400.0" y="333.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FUAR</text>
<text x="400.0" y="423.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FTMO</text>
<text x="400.0" y="603.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FHCR</text>
<text x="400.0" y="693.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FHDR</text>
<text x="400.0" y="915.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FUAR</text>
<text x="400.0" y="1005.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FTMO</text>
