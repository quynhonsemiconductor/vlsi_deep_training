<rect x="387.0" y="88.0" width="36.0" height="14" fill="#ffffff"/>
<text x="405.0" y="99.0" font-size="10" fill="#000000" text-anchor="middle">retry</text>
<text x="155.0" y="33.3" font-size="10" text-anchor="middle" fill="#000000">init UART0</text>
<text x="155.0" y="99.3" font-size="10" text-anchor="middle" fill="#000000">waiting for each MAGIC byte from PC</text>
<text x="155.0" y="170.8" font-size="10" text-anchor="middle" fill="#000000">last 4 bytes</text>
<text x="155.0" y="183.8" font-size="10" text-anchor="middle" fill="#000000">= &#x27;Q&#x27; &#x27;S&#x27; &#x27;O&#x27; &#x27;C&#x27;?</text>
<text x="155.0" y="248.8" font-size="10" text-anchor="middle" fill="#000000">waiting for the next header byte:</text>
<text x="155.0" y="261.8" font-size="10" text-anchor="middle" fill="#000000">LENGTH, DEBUG_PROG, HDR_CRC</text>
<text x="155.0" y="326.8" font-size="10" text-anchor="middle" fill="#000000">new byte within</text>
<text x="155.0" y="339.8" font-size="10" text-anchor="middle" fill="#000000">RX_TIMEOUT polls?</text>
<text x="155.0" y="416.8" font-size="10" text-anchor="middle" fill="#000000">12 header bytes</text>
<text x="155.0" y="429.8" font-size="10" text-anchor="middle" fill="#000000">received?</text>
<text x="155.0" y="513.3" font-size="10" text-anchor="middle" fill="#000000">CRC32 = HDR_CRC?</text>
<text x="155.0" y="596.8" font-size="10" text-anchor="middle" fill="#000000">LENGTH and DEBUG_PROG</text>
<text x="155.0" y="609.8" font-size="10" text-anchor="middle" fill="#000000">valid? (Table 6-1)</text>
<text x="155.0" y="681.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send ACKH</text>
<text x="155.0" y="759.3" font-size="10" text-anchor="middle" fill="#000000">DEBUG_PROG = 0x55?</text>
<text x="155.0" y="830.8" font-size="10" text-anchor="middle" fill="#000000">waiting for the next debug program</text>
<text x="155.0" y="843.8" font-size="10" text-anchor="middle" fill="#000000">or DBG_CRC byte; write it to 0x2000_0000</text>
<text x="155.0" y="908.8" font-size="10" text-anchor="middle" fill="#000000">new byte within</text>
<text x="155.0" y="921.8" font-size="10" text-anchor="middle" fill="#000000">RX_TIMEOUT polls?</text>
<text x="155.0" y="998.8" font-size="10" text-anchor="middle" fill="#000000">4096 bytes and</text>
<text x="155.0" y="1011.8" font-size="10" text-anchor="middle" fill="#000000">DBG_CRC received?</text>
<text x="155.0" y="1095.3" font-size="10" text-anchor="middle" fill="#000000">CRC32 = DBG_CRC?</text>
<text x="155.0" y="1173.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send ACKD</text>
<text x="155.0" y="1232.8" font-size="10" text-anchor="middle" fill="#000000">waiting for the next payload or PAY_CRC byte;</text>
<text x="155.0" y="1245.8" font-size="10" text-anchor="middle" fill="#000000">write the payload to 0x2000_1000 (ISRAM)</text>
<text x="155.0" y="1310.8" font-size="10" text-anchor="middle" fill="#000000">new byte within</text>
<text x="155.0" y="1323.8" font-size="10" text-anchor="middle" fill="#000000">RX_TIMEOUT polls?</text>
<text x="155.0" y="1400.8" font-size="10" text-anchor="middle" fill="#000000">all payload and</text>
<text x="155.0" y="1413.8" font-size="10" text-anchor="middle" fill="#000000">PAY_CRC bytes received?</text>
<text x="155.0" y="1497.3" font-size="10" text-anchor="middle" fill="#000000">CRC32 = PAY_CRC?</text>
<text x="155.0" y="1575.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send ACKP</text>
<text x="155.0" y="1646.8" font-size="10" text-anchor="middle" fill="#000000">read SYSCSR.DBG_EN:</text>
<text x="155.0" y="1659.8" font-size="10" text-anchor="middle" fill="#000000">= 1?</text>
<text x="155.0" y="1731.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">jump to 0x2000_1080 (ISRAM)</text>
<text x="610.0" y="99.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send QRDY</text>
<text x="610.0" y="242.3" font-size="10" text-anchor="middle" fill="#000000">clear RX FIFO,</text>
<text x="610.0" y="255.3" font-size="10" text-anchor="middle" fill="#000000">discard bytes until quiet</text>
<text x="610.0" y="268.3" font-size="10" text-anchor="middle" fill="#000000">for DRAIN_IDLE polls</text>
<text x="-49.5" y="727.5" font-size="9" text-anchor="middle" fill="#000000"></text>
<text x="415.0" y="1646.8" font-size="10" text-anchor="middle" fill="#000000">CPU polling: read</text>
<text x="415.0" y="1659.8" font-size="10" text-anchor="middle" fill="#000000">SYSCSR.DBG_EN again</text>
<text x="630.0" y="1635.0" font-size="9" text-anchor="middle" fill="#000000">leaves the loop when the host writes</text>
<text x="630.0" y="1647.0" font-size="9" text-anchor="middle" fill="#000000">DBG_BOOT.dbg_en_mask = 1 over JTAG;</text>
<text x="630.0" y="1659.0" font-size="9" text-anchor="middle" fill="#000000">a halt enters the debug program at</text>
<text x="630.0" y="1671.0" font-size="9" text-anchor="middle" fill="#000000">0x2000_0800; dret returns to this loop</text>
<text x="400.0" y="333.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FTMO</text>
<text x="400.0" y="513.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FHCR</text>
<text x="400.0" y="603.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FHDR</text>
<text x="400.0" y="915.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FTMO</text>
<text x="400.0" y="1095.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FDCR</text>
<text x="400.0" y="1317.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FTMO</text>
<text x="400.0" y="1497.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">send FPCR</text>
</svg>