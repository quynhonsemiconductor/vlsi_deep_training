<text x="120.0" y="33.3" font-size="10" text-anchor="middle" fill="#000000">init UART0, 19200 8N1</text>
<text x="120.0" y="103.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">QRDY</text>
<text x="120.0" y="173.3" font-size="10" text-anchor="middle" fill="#000000">find MAGIC (slide 1 byte)</text>
<text x="120.0" y="243.3" font-size="10" text-anchor="middle" fill="#000000">header: 12 B</text>
<text x="120.0" y="313.3" font-size="10" text-anchor="middle" fill="#000000">HDR_CRC, LENGTH, DEBUG_PROG</text>
<text x="120.0" y="383.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">ACKH</text>
<text x="120.0" y="456.8" font-size="10" text-anchor="middle" fill="#000000">DEBUG_PROG</text>
<text x="120.0" y="469.8" font-size="10" text-anchor="middle" fill="#000000">= 0x55?</text>
<text x="430.0" y="456.8" font-size="10" text-anchor="middle" fill="#000000">DEBUG_PAYLOAD</text>
<text x="430.0" y="469.8" font-size="10" text-anchor="middle" fill="#000000">to 0x2000_0000</text>
<text x="430.0" y="533.3" font-size="10" text-anchor="middle" fill="#000000">check DBG_CRC</text>
<text x="430.0" y="603.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">ACKD</text>
<text x="120.0" y="553.3" font-size="10" text-anchor="middle" fill="#000000">PAYLOAD to 0x2000_1000</text>
<text x="120.0" y="643.3" font-size="10" text-anchor="middle" fill="#000000">check PAY_CRC</text>
<text x="120.0" y="713.3" font-size="10" text-anchor="middle" fill="#000000" font-weight="bold">ACKP</text>
<text x="120.0" y="783.3" font-size="10" text-anchor="middle" fill="#000000">wait while SYSCSR.DBG_EN = 1</text>
<text x="120.0" y="853.7" font-size="11" text-anchor="middle" fill="#000000" font-weight="bold">jump to 0x2000_1080</text>
<text x="810.0" y="355.3" font-size="10" text-anchor="middle" fill="#000000">send failure token</text>
<text x="810.0" y="368.3" font-size="10" text-anchor="middle" fill="#000000">drain the line</text>
<text x="810.0" y="381.3" font-size="10" text-anchor="middle" fill="#000000">send QRDY</text>
