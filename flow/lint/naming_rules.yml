# =============================================================================
# Naming rules, as data.
#
# flow/lint/naming_check.py reads this file and enforces whatever is in it. The
# rules live here rather than inside the script for two reasons:
#
#   1. QNSC_RTL_Design_Naming_Rule is versioned and owned by someone else. When
#      V1.1 arrives, the change is an edit here -- not a patch to a Python regex
#      that only its author can read.
#   2. A rule you can read is a rule a reviewer can check the script against.
#      Right now every pattern below can be compared line by line with section
#      4.3 of the rule document.
#
# When you change a `pattern`, change the `message` beside it too -- the script
# prints the message verbatim and cannot tell that the two have diverged.
#
# Source: DM/RULES/FE/Release/QNSC_RTL_Design_Naming_Rule.pdf (MCU_guide_ws)
# Version enforced: V1.0, 15/09/2026, Tam Nguyen
# =============================================================================

version: "1.0"
document: QNSC_RTL_Design_Naming_Rule

# What the checker looks at. Vendored IP keeps its upstream conventions and is
# never renamed -- editing vendor/ is itself a CI failure, so checking it would
# put two checks in direct contradiction.
scope:
  include: ["design"]
  extensions: [".sv", ".v"]
  exclude_path_parts: ["vendor"]
  ignore_comment: "naming-check: ignore"

# -----------------------------------------------------------------------------
# Section 2 -- module, instance, internal RTL
# -----------------------------------------------------------------------------
identifiers:
  module:
    rule: "2.1 module"
    # QNSC functional module, wrapper around an IP, or a generic module.
    pattern: '^(?:m_qnsc_wrap_[a-z0-9_]+|m_qnsc_[a-z0-9_]+|qnsc_[a-z0-9_]+)$'
    message: >
      must be m_qnsc_<function>, m_qnsc_wrap_<block> or qnsc_<function>

  port:
    rule: "1.2 port prefix"
    pattern: '^(?:i_|o_|io_)[a-z0-9_]+$'
    message: must start with i_, o_ or io_

  parameter:
    rule: "2.4 parameter"
    pattern: '^(?:P_|C_|S_)[A-Z0-9_]+$'
    message: >
      must be P_<FUNCTION> (parameter), C_<FUNCTION> (constant) or S_<STATE>
      (FSM state), uppercase

  instance:
    rule: "2.2 instance"
    pattern: '^u_[a-z0-9_]+$'
    message: must be u_<function>[_<index>]

  signal:
    rule: "2.3 signal"
    pattern: '^(?:r_|w_|mem_)[a-z0-9_]+$'
    message: >
      must be r_<function> if registered, w_<function> if combinational, or
      mem_<function> if a memory array

# -----------------------------------------------------------------------------
# Section 1 -- lexical rules, applied to every identifier
# -----------------------------------------------------------------------------
lexical:
  mixed_case:
    rule: "1.1 case"
    forbid_pattern: '[a-z][A-Z]|[A-Z]{2,}[a-z]'
    allow_if_matches: '^(?:P_|C_|S_)[A-Z0-9_]+$'   # uppercase constants are fine
    message: >
      uses mixed case; identifiers are lowercase with _ (uppercase only for
      P_/C_/S_)

  active_low:
    rule: "1.3 active low"
    forbid_pattern: '\b(?:rstn|resetn|reset_b|rst_bar)\b'
    message: "active low is _n after the meaning, as in i_rst_n_sys"

  numeric_index:
    rule: "1.4 index"
    forbid_pattern: '[a-z]\d+(?:_|$)'
    allow_if_matches: '^(?:P_|C_|S_)[A-Z0-9_]+$'
    message: "a numeric index takes an underscore, as in timer_0"

# -----------------------------------------------------------------------------
# Section 1.5 -- mandatory vocabulary. Left is forbidden, right is the term.
# -----------------------------------------------------------------------------
vocabulary:
  rule: "1.5 vocabulary"
  replace:
    irq: int
    interrupt: int
    clock: clk
    reset: rst
    config: cfg
    debug: dbg
    power: pwr
    memory: mem
    peripheral: peri
    multiplexer: mux
    analog: ana
  message: "the project term is"
